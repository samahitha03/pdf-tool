<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="PDF Tool">
  <!-- Simplified cut of icon.svg: bolder shapes, no ruled lines, short pixel
       trail. Detail that reads at 512 turns to mush at 16, so the tab icon
       carries only the folder silhouette, the sheet, and three embers. -->
  <defs>
    <clipPath id="sq"><rect width="512" height="512" rx="106"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1522"/>
      <stop offset="1" stop-color="#0c0910"/>
    </linearGradient>
    <linearGradient id="p" x1=".1" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ddd8ef"/>
    </linearGradient>
    <linearGradient id="fb" x1="0" y1="0" x2="1" y2=".3">
      <stop offset="0" stop-color="#7539dd"/>
      <stop offset="1" stop-color="#9b4ae0"/>
    </linearGradient>
    <linearGradient id="ff" x1="0" y1=".1" x2="1" y2=".9">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#b74fe8"/>
    </linearGradient>
    <linearGradient id="fc" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#e0489f"/>
      <stop offset="1" stop-color="#f05fae"/>
    </linearGradient>
    <clipPath id="ffc">
      <path d="M56 236 Q36 236 36 256 L36 396 Q36 416 56 416 L344 416
               Q364 416 364 396 L364 256 Q364 236 344 236 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#g)"/>

    <!-- sheet, tucked behind the folder -->
    <rect x="150" y="62" width="168" height="200" rx="20" fill="url(#p)"/>

    <!-- ember block standing in for the whole back card -->
    <rect x="300" y="104" width="88" height="118" rx="14" fill="#ef5f24"/>

    <!-- folder -->
    <path d="M56 160 Q36 160 36 180 L36 372 Q36 392 56 392 L344 392
             Q364 392 364 372 L364 226 Q364 206 344 206 L206 206
             Q194 206 187 197 L166 169 Q159 160 147 160 Z"
          fill="url(#fb)"/>
    <path d="M56 236 Q36 236 36 256 L36 396 Q36 416 56 416 L344 416
             Q364 416 364 396 L364 256 Q364 236 344 236 Z"
          fill="url(#ff)"/>
    <g clip-path="url(#ffc)">
      <path d="M244 222 L386 222 L386 430 L188 430 Z" fill="url(#fc)"/>
    </g>

    <!-- three embers, large enough to survive downscaling -->
    <rect x="396" y="150" width="30" height="30" rx="5" fill="#f2622a"/>
    <rect x="404" y="212" width="24" height="24" rx="4" fill="#e0489f" opacity=".85"/>
    <rect x="412" y="268" width="18" height="18" rx="3" fill="#e0489f" opacity=".6"/>
  </g>
</svg>
